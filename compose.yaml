services:
  diarization:
    image: meeting-gpu:offline
    command: uvicorn gpu_services:diarization_app --host 0.0.0.0 --port 8002 --workers 1
    ports:
      - "8002:8002"
    env_file: .env.gpu
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${DIARIZATION_GPU_ID:-1}"]
              capabilities: [gpu]
    shm_size: 4gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 10
